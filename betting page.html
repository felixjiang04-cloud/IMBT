
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImBT</title>
    <link rel="stylesheet" href="basic colour scheme.css">
    <style>
        /* Additional betting page styles */
        .betting-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .betting-card {
            background: rgba(34, 34, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(128, 0, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .betting-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(128, 0, 255, 0.2);
        }
        
        .betting-card h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ffffff, #e6ccff, #ffffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite;
        }
        
        .betting-card form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        .betting-card label {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(128, 0, 255, 0.5);
        }
        
        .betting-card input[type="number"] {
            padding: 15px;
            border: 2px solid rgba(128, 0, 255, 0.3);
            border-radius: 10px;
            font-size: 1.1em;
            background: rgba(51, 51, 51, 0.8);
            color: white;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
        }
        
        .betting-card input[type="number"]:focus {
            outline: none;
            border-color: rgba(128, 0, 255, 0.8);
            box-shadow: 0 0 15px rgba(128, 0, 255, 0.3);
        }
        
        .betting-card button[type="submit"] {
            padding: 15px 30px;
            background: linear-gradient(45deg, #4B006E, #660099);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .betting-card button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(128, 0, 255, 0.4);
        }
        
        .bet-type-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }
        
        .bet-type-selector select {
            padding: 15px;
            border: 2px solid rgba(128, 0, 255, 0.3);
            border-radius: 10px;
            font-size: 1.1em;
            background: rgba(51, 51, 51, 0.8);
            color: white;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .bet-type-selector select:focus {
            outline: none;
            border-color: rgba(128, 0, 255, 0.8);
            box-shadow: 0 0 15px rgba(128, 0, 255, 0.3);
        }
        
        .bet-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1em;
        }
        
        .bet-result.win {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid rgba(0, 255, 0, 0.3);
            color: #90EE90;
        }
        
        .bet-result.loss {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid rgba(255, 0, 0, 0.3);
            color: #FFB6C1;
        }
        
        .bet-result .error {
            color: #FF6B6B;
            font-weight: bold;
        }
        
        .bet-result h3 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .bet-result p {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="betting-container">
        <div class="betting-card">
            <h1>Place Your Bet</h1>
            <p style="font-size: 1.2rem; color: #e6ccff; margin-bottom: 30px;">Enter the amount you wish to bet below:</p>
            <form id="bettingForm">
                <label for="amount">Bet Amount:</label>
                <input type="number" id="amount" name="amount" min="1" max="10000" required>
                <div class="bet-type-selector">
                    <label>Bet Type:</label>
                    <select id="betType" name="bet_type" required>
                        <option value="coin_flip">Coin Flip (1x payout)</option>
                        <option value="dice_roll">Dice Roll (1.5x payout)</option>
                        <option value="number_guess">Number Guess (8x payout)</option>
                        <option value="color_pick">Color Pick (2x/14x payout)</option>
                    </select>
                </div>
                <button type="submit">Place Bet</button>
            </form>
            <div id="betResult" class="bet-result" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        document.getElementById('bettingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = parseFloat(document.getElementById('amount').value);
            const betType = document.getElementById('betType').value;
            const resultDiv = document.getElementById('betResult');
            
            try {
                const response = await fetch('/api/betting/place-bet', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ amount, bet_type: betType })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const result = data.data.bet;
                    const isWin = result.result > 0;
                    
                    resultDiv.innerHTML = `
                        <h3>${isWin ? '🎉 You Won!' : '😔 You Lost'}</h3>
                        <p><strong>Bet Type:</strong> ${betType.replace('_', ' ').toUpperCase()}</p>
                        <p><strong>Amount:</strong> $${amount.toFixed(2)}</p>
                        <p><strong>Outcome:</strong> ${result.outcome}</p>
                        <p><strong>Result:</strong> ${isWin ? '+' : ''}$${result.result.toFixed(2)}</p>
                        <p><strong>New Balance:</strong> $${result.new_balance.toFixed(2)}</p>
                    `;
                    resultDiv.className = `bet-result ${isWin ? 'win' : 'loss'}`;
                    resultDiv.style.display = 'block';
                    
                    // Reset form
                    document.getElementById('bettingForm').reset();
                } else {
                    resultDiv.innerHTML = `<p class="error">${data.message}</p>`;
                    resultDiv.style.display = 'block';
                }
            } catch (error) {
                resultDiv.innerHTML = '<p class="error">An error occurred. Please try again.</p>';
                resultDiv.style.display = 'block';
            }
        });
    </script>
        </div>
    </div>
</body>
</html>
