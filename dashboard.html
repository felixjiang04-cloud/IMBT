<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImBT - Dashboard</title>
    <link rel="stylesheet" href="basic colour scheme.css">
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .dashboard-card {
            background: rgba(34, 34, 34, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(128, 0, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .dashboard-card h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ffffff, #e6ccff, #ffffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite;
        }
        
        .user-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .info-card {
            background: rgba(51, 51, 51, 0.5);
            border: 1px solid rgba(128, 0, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        
        .info-card h3 {
            color: #e6ccff;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .info-card .value {
            color: #ffffff;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .navigation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .nav-button {
            padding: 15px 20px;
            background: linear-gradient(45deg, #4B006E, #660099);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(128, 0, 255, 0.4);
        }
        
        .logout-button {
            background: linear-gradient(45deg, #660033, #990066);
            margin-top: 20px;
        }
        
        .logout-button:hover {
            box-shadow: 0 10px 25px rgba(255, 0, 128, 0.4);
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #90EE90;
        }
        
        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #FFB6C1;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-card">
            <h1>Welcome to ImBT</h1>
            
            <div id="userInfo" class="user-info">
                <!-- User info will be loaded here -->
            </div>
            
            <div class="navigation-grid">
                <a href="/" class="nav-button">🎲 Place Bet</a>
                <a href="/profile" class="nav-button">👤 Profile</a>
                <a href="/leaderboard" class="nav-button">🏆 Leaderboard</a>
                <a href="/friends" class="nav-button">👥 Friends</a>
                <a href="/game" class="nav-button">🎮 Games</a>
            </div>
            
            <button class="nav-button logout-button" onclick="logout()">🚪 Logout</button>
            
            <div id="message" class="message" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        // Load user information
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const user = data.data.user;
                    const userInfoDiv = document.getElementById('userInfo');
                    
                    const winRate = user.total_bets > 0 ? (user.total_wins / user.total_bets * 100).toFixed(1) : 0;
                    
                    userInfoDiv.innerHTML = `
                        <div class="info-card">
                            <h3>Username</h3>
                            <div class="value">${user.username}</div>
                        </div>
                        <div class="info-card">
                            <h3>Balance</h3>
                            <div class="value">$${parseFloat(user.balance).toFixed(2)}</div>
                        </div>
                        <div class="info-card">
                            <h3>Total Bets</h3>
                            <div class="value">${user.total_bets}</div>
                        </div>
                        <div class="info-card">
                            <h3>Win Rate</h3>
                            <div class="value">${winRate}%</div>
                        </div>
                        <div class="info-card">
                            <h3>Wins</h3>
                            <div class="value">${user.total_wins}</div>
                        </div>
                        <div class="info-card">
                            <h3>Losses</h3>
                            <div class="value">${user.total_losses}</div>
                        </div>
                    `;
                } else {
                    showMessage('Failed to load user information', 'error');
                }
            } catch (error) {
                showMessage('An error occurred while loading user information', 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<p>${text}</p>`;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }

        // Load user info when page loads
        loadUserInfo();
    </script>
</body>
</html>
