<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>RPG - Dragon Repeller</title>
    <link rel="stylesheet" href="basic colour scheme.css">
    <link rel="stylesheet" href="game.css">
  </head>
  <body>
    <div class="center-content">
      <div class="content-card">
        <h1 class="hero-title">Dragon Repeller</h1>
        <div id="game">
          <div id="stats" style="display: flex; justify-content: space-around; margin-bottom: 20px; padding: 15px; background: rgba(128, 0, 255, 0.1); border-radius: 10px; border: 1px solid rgba(128, 0, 255, 0.3);">
            <span class="stat" style="color: #ffffff; font-weight: 600;">XP: <strong><span id="xpText">0</span></strong></span>
            <span class="stat" style="color: #ffffff; font-weight: 600;">Health: <strong><span id="healthText">100</span></strong></span>
            <span class="stat" style="color: #ffffff; font-weight: 600;">Gold: <strong><span id="goldText">50</span></strong></span>
          </div>
          <div id="controls" style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;">
            <button id="button1" style="padding: 12px 24px; background: linear-gradient(45deg, #4B006E, #660099); color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;">Go to store</button>
            <button id="button2" style="padding: 12px 24px; background: linear-gradient(45deg, #4B006E, #660099); color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;">Go to cave</button>
            <button id="button3" style="padding: 12px 24px; background: linear-gradient(45deg, #4B006E, #660099); color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;">Fight dragon</button>
          </div>
          <div id="monsterStats" style="display: flex; justify-content: space-around; margin-bottom: 20px; padding: 15px; background: rgba(255, 0, 0, 0.1); border-radius: 10px; border: 1px solid rgba(255, 0, 0, 0.3);">
            <span class="stat" style="color: #ffffff; font-weight: 600;">Monster Name: <strong><span id="monsterName"></span></strong></span>
            <span class="stat" style="color: #ffffff; font-weight: 600;">Health: <strong><span id="monsterHealth"></span></strong></span>
          </div>
          <div id="text" style="color: #ffffff; font-size: 1.1rem; line-height: 1.6; padding: 20px; background: rgba(34, 34, 34, 0.8); border-radius: 10px; border: 1px solid rgba(128, 0, 255, 0.3);">Welcome to Dragon Repeller. You must defeat the dragon that is preventing people from leaving the town. You are in the town square. Where do you want to go? Use the buttons above.</div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
