<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImBT - Login</title>
    <link rel="stylesheet" href="basic colour scheme.css">
    <style>
        /* Additional login-specific styles */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-card">
            <h1>Login to ImBT</h1>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">👁</button>
                </div>
                <button type="submit">Login</button>
            </form>
            <div id="loginMessage" class="message" style="display: none;"></div>
        </div>
        
        <script>
            function togglePassword() {
                const passwordInput = document.getElementById('password');
                const toggleButton = document.querySelector('.password-toggle');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleButton.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    toggleButton.textContent = '👁';
                }
            }

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const messageDiv = document.getElementById('loginMessage');
                
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Store token
                        localStorage.setItem('token', data.data.token);
                        localStorage.setItem('user', JSON.stringify(data.data.user));
                        
                        messageDiv.innerHTML = '<p class="success">Login successful! Redirecting...</p>';
                        messageDiv.style.display = 'block';
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1500);
                    } else {
                        messageDiv.innerHTML = `<p class="error">${data.message}</p>`;
                        messageDiv.style.display = 'block';
                    }
                } catch (error) {
                    messageDiv.innerHTML = '<p class="error">An error occurred. Please try again.</p>';
                    messageDiv.style.display = 'block';
                }
            });
        </script>
        <a href="betting.html" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
