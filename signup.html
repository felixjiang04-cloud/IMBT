<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ImBT - Sign Up</title>
    <link rel="stylesheet" href="basic colour scheme.css">
    <style>
        /* Additional signup-specific styles */
        .signup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-card">
            <h1>Sign Up for ImBT</h1>
            <form id="signupForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="email" id="email" placeholder="Email" required>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">👁</button>
                </div>
                <div class="password-container">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁</button>
                </div>
                <button type="submit">Create Account</button>
            </form>
            <div id="signupMessage" class="message" style="display: none;"></div>
        </div>
        
        <script>
            function togglePassword(inputId) {
                const passwordInput = document.getElementById(inputId);
                const toggleButton = passwordInput.parentElement.querySelector('.password-toggle');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleButton.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    toggleButton.textContent = '👁';
                }
            }

            document.getElementById('signupForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const messageDiv = document.getElementById('signupMessage');
                
                // Validate passwords match
                if (password !== confirmPassword) {
                    messageDiv.innerHTML = '<p class="error">Passwords do not match</p>';
                    messageDiv.style.display = 'block';
                    return;
                }
                
                // Validate password strength
                if (password.length < 6) {
                    messageDiv.innerHTML = '<p class="error">Password must be at least 6 characters long</p>';
                    messageDiv.style.display = 'block';
                    return;
                }
                
                try {
                    const response = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Store token
                        localStorage.setItem('token', data.data.token);
                        localStorage.setItem('user', JSON.stringify(data.data.user));
                        
                        messageDiv.innerHTML = '<p class="success">Account created successfully! Redirecting...</p>';
                        messageDiv.style.display = 'block';
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1500);
                    } else {
                        messageDiv.innerHTML = `<p class="error">${data.message}</p>`;
                        messageDiv.style.display = 'block';
                    }
                } catch (error) {
                    messageDiv.innerHTML = '<p class="error">An error occurred. Please try again.</p>';
                    messageDiv.style.display = 'block';
                }
            });
        </script>
        <a href="betting.html" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
